<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NQL Group</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #000; color: #fff; font-family: "Lato", sans-serif; font-weight: 300; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; overflow: hidden; }
      .film { position: fixed; inset: 0; z-index: 0; background: #000; }
      .film img, .film video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
      .film video { opacity: 0; transition: opacity 1.2s ease; }
      .film video.on { opacity: 1; }
      .film .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,.25) 45%, rgba(0,0,0,.6)); }
      .door { position: fixed; inset: 0; z-index: 3; background: #fff; transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1); }
      .door video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
      .door.leaving { opacity: 0; pointer-events: none; }
      main { position: relative; z-index: 1; opacity: 0; transition: opacity 1.6s ease; }
      body.arrived main { opacity: 1; }
      .wordmark { height: 28px; width: auto; }
      @media (min-width: 768px) { .wordmark { height: 40px; } }
      @keyframes write { 0% { opacity: 0; clip-path: inset(-20% 100% -20% 0); } 12% { opacity: 1; } 100% { opacity: 1; clip-path: inset(-20% -2% -20% 0); } }
      .line { margin: 40px 0 0; font-weight: 300; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255,255,255,.7); opacity: 0; animation: fade 1.6s ease 0.3s forwards; animation-play-state: paused; }
      .soon { margin: 14px 0 0; font-weight: 300; font-size: 17px; color: #fff; opacity: 0; animation: fade 1.6s ease 0.7s forwards; animation-play-state: paused; }
      .contact { margin: 56px 0 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; animation: fade 1.6s ease 1.1s forwards; animation-play-state: paused; }
      .contact a { color: rgba(255,255,255,.7); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.3); padding-bottom: 2px; }
      .contact a:hover { color: #fff; border-color: #fff; }
      @keyframes fade { to { opacity: 1; } }
      body.arrived .line, body.arrived .soon, body.arrived .contact { animation-play-state: running; }
      @media (prefers-reduced-motion: reduce) { .wordmark, .line, .soon, .contact { animation: none; opacity: 1; } .film video { display: none; } .door { display: none; } main { opacity: 1; } }
    </style>
  </head>
  <body>
    <!-- The same film as the homepage, in black and white, behind the words.
         Phones and slow connections get the still photograph instead. -->
    <!-- The intro film first: the swirl and the name written in, on white.
         When it ends the white lifts and the words sit on the moving film. -->
    <div class="door" id="door" aria-hidden="true">
      <video id="intro" src="/video/intro.mp4" muted autoplay playsinline preload="auto"></video>
    </div>
    <div class="film" aria-hidden="true">
      <img src="/images/hero-home.jpg" alt="" />
      <video id="film" muted autoplay loop playsinline preload="none" poster="/images/hero-home.jpg"></video>
      <div class="shade"></div>
    </div>
    <main>
      <img class="wordmark" src="/gallery/intro-wordmark-white.png" alt="NQL Group" />
      <p class="line">Under construction</p>
      <p class="soon">We will be live shortly.</p>
      <p class="contact"><a href="mailto:info@nqlgroup.com">info@nqlgroup.com</a></p>
    </main>
    <script>
      (function () {
        var door = document.getElementById("door"), intro = document.getElementById("intro");
        var opened = false;
        function open() {
          if (opened) return; opened = true;
          door.classList.add("leaving");
          document.body.classList.add("arrived");
          setTimeout(function () { door.remove(); }, 1500);
        }
        if (!door || !intro || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) { document.body.classList.add("arrived"); if (door) door.remove(); return; }
        intro.muted = true; intro.defaultMuted = true; intro.playsInline = true;
        intro.addEventListener("ended", open);
        intro.addEventListener("error", open);
        var p = intro.play(); if (p && p.catch) p.catch(open);
        door.addEventListener("click", open);
        setTimeout(open, 9000);
      })();
    </script>
    <script>
      (function () {
        var v = document.getElementById("film");
        if (!v || window.innerWidth < 768) return;
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var net = navigator.connection;
        if (net && net.saveData) return;
        // Set in script as well as in markup: some browsers only honour a
        // muted autoplay when the property itself is true before play().
        v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
        var tries = 0;
        function go() {
          var p = v.play();
          if (p && p.then) p.then(function () { v.classList.add("on"); }).catch(function () { if (tries++ < 20) setTimeout(go, 500); });
          else v.classList.add("on");
        }
        v.addEventListener("canplay", go, { once: true });
        v.addEventListener("playing", function () { v.classList.add("on"); });
        // A browser that refuses until the page is touched gets its chance.
        ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (e) { window.addEventListener(e, go, { once: true, passive: true }); });
        document.addEventListener("visibilitychange", function () { if (!document.hidden && v.paused) go(); });
        v.src = "/video/hero.mp4";
        v.load();
      })();
    </script>
  </body>
</html>
