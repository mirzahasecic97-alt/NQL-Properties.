<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NQL Group</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #fff; color: #111; font-family: "Lato", sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .wordmark { height: 28px; width: auto; opacity: 0; clip-path: inset(-20% 100% -20% 0); animation: write 2.6s cubic-bezier(0.65, 0, 0.35, 1) 0.4s forwards; }
      @media (min-width: 768px) { .wordmark { height: 40px; } }
      @keyframes write { 0% { opacity: 0; clip-path: inset(-20% 100% -20% 0); } 12% { opacity: 1; } 100% { opacity: 1; clip-path: inset(-20% -2% -20% 0); } }
      .line { margin: 40px 0 0; font-weight: 300; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: #777; opacity: 0; animation: fade 1.6s ease 2.6s forwards; }
      .soon { margin: 14px 0 0; font-weight: 300; font-size: 17px; color: #111; opacity: 0; animation: fade 1.6s ease 3.2s forwards; }
      .contact { margin: 56px 0 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0; animation: fade 1.6s ease 3.8s forwards; }
      .contact a { color: #777; text-decoration: none; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
      .contact a:hover { color: #111; border-color: #111; }
      @keyframes fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .wordmark, .line, .soon, .contact { animation: none; opacity: 1; clip-path: none; } }
    </style>
  </head>
  <body>
    <main>
      <img class="wordmark" src="/gallery/intro-wordmark.png" alt="NQL Group" />
      <p class="line">Under construction</p>
      <p class="soon">We will be live shortly.</p>
      <p class="contact"><a href="mailto:info@nqlgroup.com">info@nqlgroup.com</a></p>
    </main>
  </body>
</html>
