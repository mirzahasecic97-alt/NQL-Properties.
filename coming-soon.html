<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NQL Group</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&display=swap" rel="stylesheet" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #fff; color: #111; font-family: "Lato", sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      .door { position: fixed; inset: 0; background: #fff; }
      .door video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; opacity: 0; animation: fade 0.6s ease 0.1s forwards; transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
      .door.done video { opacity: 0 !important; }
      main { position: relative; opacity: 0; transition: opacity 1.6s ease; }
      body.settled main { opacity: 1; }
      .wordmark { height: 28px; width: auto; }
      @media (min-width: 768px) { .wordmark { height: 40px; } }
      .line { margin: 40px 0 0; font-weight: 300; font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: #777; }
      .soon { margin: 14px 0 0; font-weight: 300; font-size: 17px; color: #111; }
      .contact { margin: 56px 0 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
      .contact a { color: #777; text-decoration: none; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
      .contact a:hover { color: #111; border-color: #111; }
      @keyframes fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .door video { animation: none; } }
    </style>
  </head>
  <body>
    <div class="door" id="door">
      <video src="/video/intro.mp4" muted playsinline autoplay preload="auto" aria-label="NQL Group"></video>
    </div>
    <main>
      <img class="wordmark" src="/gallery/intro-wordmark.png" alt="NQL Group" />
      <p class="line">Under construction</p>
      <p class="soon">We will be live shortly.</p>
      <p class="contact"><a href="mailto:info@nqlgroup.com">info@nqlgroup.com</a></p>
    </main>
    <script>
      // The film plays once; when it ends the words take its place and stay.
      (function () {
        var door = document.getElementById("door");
        var film = door.querySelector("video");
        var done = false;
        function settle() {
          if (done) return; done = true;
          door.classList.add("done");
          document.body.classList.add("settled");
          setTimeout(function () { door.remove(); }, 1300);
        }
        film.addEventListener("ended", settle);
        film.addEventListener("error", settle);
        var playing = film.play();
        if (playing && playing.catch) playing.catch(settle);
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { film.pause(); setTimeout(settle, 300); }
        setTimeout(settle, 9000);
      })();
    </script>
  </body>
</html>
